<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090616">
  <title>管理者ページ | Ichijo AI Lab</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <a class="brand" href="index.html"><span class="brand-mark">AI</span><span>Ichijo AI Lab</span></a>
    <a class="button button-ghost small" href="index.html">閲覧ページへ</a>
  </header>
  <main class="admin-shell">
    <aside class="admin-sidebar">
      <p class="eyebrow">ADMIN CONSOLE</p>
      <h1>管理者ページ</h1>
      <p class="admin-warning">試作版：データはこの端末のブラウザ内だけに保存されます。本番公開前にログインと共有データベースを接続します。</p>
      <nav aria-label="管理メニュー"><button class="admin-tab active" data-tab="overview">概要</button><button class="admin-tab" data-tab="apps">アプリ管理</button><button class="admin-tab" data-tab="posts">ブログ管理</button><button class="admin-tab" data-tab="messages">受信内容</button></nav>
    </aside>
    <div class="admin-content">
      <section class="admin-panel active" id="panel-overview">
        <div class="admin-title"><div><p class="eyebrow">DASHBOARD</p><h2>活動を更新する</h2></div><span class="status-pill">LOCAL PREVIEW</span></div>
        <div class="dashboard-grid"><article><span>公開アプリ</span><strong id="app-count">0</strong></article><article><span>ブログ記事</span><strong id="post-count">0</strong></article><article><span>受信内容</span><strong id="message-count">0</strong></article></div>
        <div class="admin-card"><h3>この管理画面でできること</h3><p>アプリとブログ記事の追加・削除、フォームから届いた内容の確認ができます。変更は同じブラウザで閲覧ページを開くと反映されます。</p></div>
      </section>
      <section class="admin-panel" id="panel-apps">
        <div class="admin-title"><div><p class="eyebrow">APPLICATIONS</p><h2>アプリ管理</h2></div></div>
        <form id="app-form" class="admin-form"><label>アプリ名<input name="title" required></label><label>カテゴリ<input name="category" placeholder="学習 / 地域課題" required></label><label>説明<textarea name="description" rows="3" required></textarea></label><label>リンク（任意）<input type="url" name="url" placeholder="https://"></label><button class="button button-primary" type="submit">アプリを追加</button></form>
        <div id="admin-app-list" class="admin-list"></div>
      </section>
      <section class="admin-panel" id="panel-posts">
        <div class="admin-title"><div><p class="eyebrow">BLOG</p><h2>ブログ管理</h2></div></div>
        <form id="post-form" class="admin-form"><label>タイトル<input name="title" required></label><label>日付<input type="date" name="date" required></label><label>概要<textarea name="excerpt" rows="3" required></textarea></label><button class="button button-primary" type="submit">記事を追加</button></form>
        <div id="admin-post-list" class="admin-list"></div>
      </section>
      <section class="admin-panel" id="panel-messages">
        <div class="admin-title"><div><p class="eyebrow">INBOX</p><h2>受信内容</h2></div><button id="clear-messages" class="button button-danger small" type="button">すべて削除</button></div>
        <div id="admin-message-list" class="admin-list"></div>
      </section>
    </div>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
